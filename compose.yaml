services:
  postgres:
    image: postgres:17
    container_name: payment-platform-postgres
    environment:
      POSTGRES_DB: payment_platform
      POSTGRES_USER: payment_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - payment-platform-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_app -d payment_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  payment-platform-data: