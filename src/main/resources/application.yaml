
spring:
  application:
    name: payment-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_platform}
    username: ${DB_USERNAME:payment_app}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true